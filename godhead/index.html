<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G⚙dhead</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        .back {
            position: absolute;
            top: 12px;
            left: 15px;

            color: white;
            text-decoration: none;

            font-size: 16px;
            opacity: 0.7;
			
			user-select: none;
        }

		.back-sprite {
			position: absolute;
			top: 50%;
			left: 50%;

			width: 450px;
			height: 450px;
			object-fit: contain;

			transform: translate(-50%, -50%);
			animation: slowRotate 12s linear infinite;
			
			opacity: 0.15;

			pointer-events: none;
		}

		@keyframes slowRotate {
			from {
				transform: translate(-50%, -50%) rotate(0deg);
			}

			to {
				transform: translate(-50%, -50%) rotate(360deg);
			}
		}

        .sprite {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 350px;
            height: 350px;
            object-fit: contain;

            transform: translate(-50%, -50%) rotate(0deg);

            transition: transform 0.35s ease-in-out;
			
			user-select: none;
        }

        .text {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;

            text-align: center;

            color: white;
            opacity: 0.20;

            font-style: italic;
			
			user-select: none;
        }

        .text a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <a href="../" class="back">←</a>

	<img src="../othercog.png" class="back-sprite" alt="">
	<img src="../firstcog.png" class="sprite" alt="Godhead">

    <div class="text">
        <a href="../music/">chapter 3</a>, the poor mother was distraught.
    </div>

    <script>
        const sprite = document.querySelector(".sprite");

        let rotation = 0;

        setInterval(() => {
            rotation += 45;

            sprite.style.transform =
                `translate(-50%, -50%) rotate(${rotation}deg)`;
        }, 2000);
    </script>

</body>
</html>
